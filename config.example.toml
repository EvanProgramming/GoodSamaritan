[github]
min_stars = 3000
active_days = 14
max_issue_age_days = 14
max_repositories = 10
max_issues_per_repository = 10
# Skip very large repositories in autonomous discovery; explicit targeted runs
# remain permitted after operator review.
max_repository_size_kb = 50000
languages = []
repository_blacklist = []
organization_blacklist = []
allow_assigned = false
# Retried only for transient GitHub network errors, 429s, and 5xx responses.
retry_attempts = 4
retry_base_seconds = 2

[limits]
max_agent_steps = 100
# Paid DeepSeek fallback is intentionally capped lower for targeted runs.
paid_model_max_agent_steps = 40
# Retry malformed model actions and recoverable tool errors before abandoning an attempt.
recoverable_tool_retries = 3
max_modified_files = 12
max_diff_lines = 1000
command_timeout_seconds = 600
test_retries = 3
daily_model_calls = 100
daily_pr_limit = 5
# Try several ranked issues in a repository before giving up on it.
max_issue_assessments_per_run = 5
provider_cooldown_seconds = 60
provider_retry_rounds = 2
provider_retry_delay_seconds = 5
# Wait at least this long between calls to the same provider API.
provider_min_interval_seconds = 65

[runtime]
dry_run = true
allow_submit = false
# Installs project-declared dependencies only into each disposable clone.
allow_dependency_install = false
daemon_interval_seconds = 86400
# Retry provider-wide rate limits sooner than the normal discovery cycle.
model_retry_interval_seconds = 900
# After a local no-patch, validation, or review rejection, assess another
# untried candidate before returning to the normal scheduled interval.
max_contribution_attempts_per_cycle = 3
database_path = "good-samaritan.db"
work_directory = "good-samaritan-work"

[social]
# Set true only after confirming the independent account’s public behavior.
enabled = false
# 0 means no daily cap; each Issue is still commented on at most once.
max_issue_comments_per_day = 0
allow_large_repositories = false

[models]
priority = ["groq", "gemini", "openrouter"]
groq_model = ""
gemini_model = ""
openrouter_model = ""
# Never add DeepSeek to priority: it is enabled only for an explicit --repository run.
deepseek_model = ""
# Optional local OpenAI-compatible gateway. Install with `npm install -g omniroute`,
# run `omniroute`, then set priority to include "omniroute" and use OmniRoute's coding router `auto/coding`.
# OMNIROUTE_API_KEY is optional only when this URL remains a loopback address.
omniroute_model = "auto/coding"
# If auto/coding selects an anonymous backend that returns no usable text,
# retry through the verified free OpenCode model in the same OmniRoute gateway.
omniroute_fallback_model = "oc/deepseek-v4-flash-free"
omniroute_base_url = "http://localhost:20128/v1"
