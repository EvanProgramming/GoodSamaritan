[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "good-samaritan"
version = "0.1.0"
description = "A cautious experimental AI open-source contributor."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Good Samaritan contributors"}]
dependencies = ["httpx>=0.27", "pydantic>=2.7", "pydantic-settings>=2.3", "typer>=0.12", "rich>=13.7"]

[project.optional-dependencies]
test = ["pytest>=8.2"]

[project.scripts]
good-samaritan = "good_samaritan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/good_samaritan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
